<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mergington High School Activities</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ...existing styles... */
    .participants-section {
      margin-top: 0.75rem;
      padding: 0.6rem 0.8rem 0.7rem;
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04),
        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
    }

    .participants-section h4 {
      margin: 0 0 0.45rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .participants-section h4::before {
      content: "👥";
      font-size: 0.9rem;
      filter: grayscale(0.2);
    }

    .participants-list {
      margin: 0;
      padding-left: 1.05rem;
      list-style: disc;
      display: grid;
      gap: 0.2rem;
      max-height: 140px;
      overflow: auto;
      scrollbar-width: thin;
    }

    .participants-list li {
      font-size: 0.72rem;
      line-height: 1.15;
      color: #475569;
      background: rgba(255, 255, 255, 0.6);
      padding: 2px 6px 3px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      display: inline-block;
      box-shadow: 0 0 0 1px #fff inset;
    }

    .no-participants {
      margin: 0;
      font-size: 0.7rem;
      font-style: italic;
      color: #64748b;
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <header>
    <h1>Mergington High School</h1>
    <h2>Extracurricular Activities</h2>
  </header>

  <main>
    <section id="activities-container">
      <h3>Available Activities</h3>
      <div id="activities-list">
        <!-- Activities will be loaded here -->
        <p>Loading activities...</p>
      </div>
    </section>

    <section id="signup-container">
      <h3>Sign Up for an Activity</h3>
      <form id="signup-form">
        <div class="form-group">
          <label for="email">Student Email:</label>
          <input type="email" id="email" required placeholder="your-email@mergington.edu" />
        </div>
        <div class="form-group">
          <label for="activity">Select Activity:</label>
          <select id="activity" required>
            <option value="">-- Select an activity --</option>
            <!-- Activity options will be loaded here -->
          </select>
        </div>
        <button type="submit">Sign Up</button>
      </form>
      <div id="message" class="hidden"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2023 Mergington High School</p>
  </footer>

  <script src="app.js"></script>
  <script>
    // ...existing code that fetches activities...

    function renderActivities(data) {
      const container = document.getElementById("activities"); // existing container
      container.innerHTML = "";
      Object.entries(data).forEach(([name, info]) => {
        const card = document.createElement("div");
        card.className = "activity-card";
        // ...maybe existing heading / base structure...
        card.innerHTML = `
            <h3>${name}</h3>
            <p class="description">${info.description}</p>
            <p class="schedule"><strong>Schedule:</strong> ${info.schedule}</p>
            <p class="capacity"><strong>Capacity:</strong> ${info.participants.length}/${info.max_participants}</p>
            <div class="participants-section">
              <h4>Participants</h4>
              ${info.participants.length
            ? `<ul class="participants-list">${info.participants
              .map((p) => `<li title="${p}">${p}</li>`)
              .join("")
            }</ul>`
            : `<p class="no-participants">No participants yet</p>`
          }
            </div>
            <!-- ...existing signup form / buttons (unchanged)... -->
          `;
        container.appendChild(card);
      });
    }

    // ...existing fetch logic, replace final DOM update call with renderActivities...
    fetch("/activities")
      .then((r) => r.json())
      .then((data) => renderActivities(data))
      .catch((err) => console.error(err));

    // If you already had a signup handler that refreshed cards, ensure it re-calls fetch + renderActivities.
    // ...existing code...
  </script>
</body>

</html>
